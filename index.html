<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Editor - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="gallery-header">
      <div>
        <h1>My Sprites</h1>
        <p class="subtitle">Select a sprite to edit or start a new project</p>
      </div>
      <button id="createNewBtn" class="btn btn-primary">+ Create New Sprite</button>
    </header>

    <section class="preset-section">
      <div class="preset-header">
        <h2>Preset Assets</h2>
        <p>Start from a common block or prop and customize it.</p>
      </div>
      <div id="presetGrid" class="preset-grid"></div>
    </section>

    <div class="sprite-grid" id="spriteGrid">
      <!-- Sprite cards render dynamically -->
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'pixel_sprites';

    function getSprites() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function deleteSprite(id, event) {
      event.stopPropagation();
      if (confirm('Are you sure you want to delete this sprite?')) {
        const sprites = getSprites();
        delete sprites[id];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sprites));
        renderGallery();
      }
    }

    function createNewSprite() {
      const newId = 'sprite_' + Date.now();
      window.location.href = `editor.html?id=${newId}`;
    }

    function clonePresetToLibrary(asset) {
      const sprites = getSprites();
      const newId = 'sprite_' + Date.now();
      const clone = {
        id: newId,
        name: `${asset.name} Copy`,
        updatedAt: Date.now(),
        gridWidth: asset.gridWidth,
        gridHeight: asset.gridHeight,
        pixels: asset.pixels.map(row => row.slice())
      };

      sprites[newId] = clone;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sprites));
      window.location.href = `editor.html?id=${newId}`;
    }

    async function loadPresetAssets() {
      const grid = document.getElementById('presetGrid');
      if (!grid) return;

      try {
        const response = await fetch('./presets.json');
        if (!response.ok) throw new Error('Failed to load presets');
        const presetAssets = await response.json();

        grid.innerHTML = '';

        presetAssets.forEach(asset => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'preset-card';
          card.title = `Use ${asset.name}`;
          card.onclick = () => clonePresetToLibrary(asset);

          const canvas = document.createElement('canvas');
          canvas.width = 96;
          canvas.height = 96;
          const ctx = canvas.getContext('2d');
          const pixelSize = Math.min(96 / asset.gridWidth, 96 / asset.gridHeight);
          const offsetX = (96 - asset.gridWidth * pixelSize) / 2;
          const offsetY = (96 - asset.gridHeight * pixelSize) / 2;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let r = 0; r < asset.gridHeight; r++) {
            const row = Array.isArray(asset.pixels?.[r]) ? asset.pixels[r] : [];
            for (let c = 0; c < asset.gridWidth; c++) {
              const color = row[c];
              if (!color) continue;
              ctx.fillStyle = color;
              ctx.fillRect(offsetX + c * pixelSize, offsetY + r * pixelSize, pixelSize, pixelSize);
            }
          }

          const label = document.createElement('span');
          label.className = 'preset-name';
          label.textContent = asset.name;

          card.appendChild(canvas);
          card.appendChild(label);
          grid.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        const isFileOrigin = window.location.protocol === 'file:';
        grid.innerHTML = isFileOrigin
          ? '<p class="empty-state">Preset assets unavailable. Open the project through a local web server, for example: python3 -m http.server 8000</p>'
          : '<p class="empty-state">Preset assets unavailable.</p>';
      }
    }

    function renderGallery() {
      const grid = document.getElementById('spriteGrid');
      const sprites = getSprites();
      const spriteList = Object.values(sprites).sort((a, b) => b.updatedAt - a.updatedAt);

      grid.innerHTML = '';

      if (spriteList.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>No sprites created yet!</p>
            <button class="btn btn-primary" onclick="createNewSprite()">Create Your First Sprite</button>
          </div>
        `;
        return;
      }

      spriteList.forEach(sprite => {
        const card = document.createElement('div');
        card.className = 'sprite-card';
        card.onclick = () => window.location.href = `editor.html?id=${sprite.id}`;

        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');

        const spriteWidth = sprite.gridWidth || 16;
        const spriteHeight = sprite.gridHeight || 16;
        const pixelSize = Math.min(128 / spriteWidth, 128 / spriteHeight);
        const offsetX = (128 - spriteWidth * pixelSize) / 2;
        const offsetY = (128 - spriteHeight * pixelSize) / 2;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < spriteHeight; r++) {
          for (let c = 0; c < spriteWidth; c++) {
            const row = sprite.pixels?.[r] || [];
            const color = row[c];
            if (color == null || color === '' || color === 'transparent') continue;
            ctx.fillStyle = color;
            ctx.fillRect(offsetX + c * pixelSize, offsetY + r * pixelSize, pixelSize, pixelSize);
          }
        }

        const info = document.createElement('div');
        info.className = 'card-info';

        const titleRow = document.createElement('div');
        titleRow.className = 'card-title-row';

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'sprite-name-input card-name-input';
        nameInput.value = sprite.name || 'Untitled Sprite';
        nameInput.setAttribute('aria-label', 'Sprite name');
        nameInput.addEventListener('change', (e) => {
          const sprites = getSprites();
          if (!sprites[sprite.id]) return;

          sprites[sprite.id].name = e.target.value.trim() || 'Untitled Sprite';
          sprites[sprite.id].updatedAt = Date.now();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sprites));
          renderGallery();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.title = 'Delete';
        deleteBtn.textContent = '✕';
        deleteBtn.onclick = (e) => deleteSprite(sprite.id, e);

        titleRow.appendChild(nameInput);
        titleRow.appendChild(deleteBtn);

        const date = document.createElement('span');
        date.className = 'sprite-date';
        date.textContent = `Edited ${new Date(sprite.updatedAt).toLocaleDateString()}`;

        info.appendChild(titleRow);
        info.appendChild(date);

        card.appendChild(canvas);
        card.appendChild(info);
        grid.appendChild(card);
      });
    }

    document.getElementById('createNewBtn').addEventListener('click', createNewSprite);
    loadPresetAssets();
    renderGallery();
  </script>
</body>
</html>
